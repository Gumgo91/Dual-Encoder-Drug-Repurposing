[project]
name = "dual-encoder-drug-repurposing"
version = "1.0.0"
description = "Dual-encoder contrastive learning of chemical structure and L1000 transcriptional responses"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "rdkit>=2023.9.1",
    "cmapPy>=4.0.1",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gcn = ["torch-geometric>=2.5"]
chemberta = ["transformers>=4.40"]
