[project]
name = "l1000"
version = "0.1.0"
description = "Drug-Aware Contrastive Connectivity for Cancer Drug Repurposing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "cmapPy>=4.0.1",
    "h5py>=3.8.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "rdkit>=2023.3.1",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
chem = [
    "rdkit>=2023.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
